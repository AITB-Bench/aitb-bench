[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aitb-bench"
version = "0.1.0"
description = "AITB - Assurance Instrument Test Bench: test the instrument that judges, not just the thing being judged. T1-T5 doctrine, preset-driven checks, evidence bundles, absence carries the exit code."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "Steven Zhao", email = "aitb-bench@users.noreply.github.com"}]
keywords = ["assurance", "test-bench", "conformance", "verification", "negative-control", "evidence"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
aitb = "aitb_bench.core:main"

[project.urls]
Homepage = "https://github.com/AITB-Bench/aitb-bench"
Repository = "https://github.com/AITB-Bench/aitb-bench"
Issues = "https://github.com/AITB-Bench/aitb-bench/issues"

[tool.setuptools]
packages = ["aitb_bench"]

[tool.setuptools.package-data]
aitb_bench = ["presets/*.json"]
